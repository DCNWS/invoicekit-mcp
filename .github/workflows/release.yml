name: release
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  binaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # One static file per platform, so a user who wants the server in a
      # container or on a laptop with no Go toolchain has something to download.
      - name: build
        run: |
          set -eu
          for p in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            goos=${p%/*}; goarch=${p#*/}
            bin=invoicekit-mcp
            [ "$goos" = windows ] && bin=invoicekit-mcp.exe
            out=dist/$TAG-$goos-$goarch
            mkdir -p "$out"
            CGO_ENABLED=0 GOOS=$goos GOARCH=$goarch go build -trimpath -ldflags='-s -w' -o "$out/$bin" ./cmd/invoicekit-mcp
            cp LICENSE NOTICE.md README.md "$out/"
            (cd "$out" && tar czf "../$(basename $out).tar.gz" .)
          done
          # The field names keep no ./ prefix: the notes tell a user to run
          # `sha256sum -c SHA256SUMS.txt` next to the files they downloaded,
          # whose names have no prefix, and a sum file naming ./x.tar.gz fails
          # every line for someone holding x.tar.gz.
          (cd dist && sha256sum ./*.tar.gz | sed 's#  \./#  #' > SHA256SUMS.txt)
        env:
          TAG: ${{ github.ref_name }}
      - name: publish
        # The notes go through a file, not a quoted argument: a multi-line
        # string in a run block is exactly where YAML indentation goes wrong,
        # and it did here.
        run: |
          set -eu
          cat > notes.md <<'NOTES'
          EN 16931 validation, Factur-X and ZUGFeRD auditing, and CII to UBL conversion over MCP, running entirely in-process: no invoice leaves the machine and no API key is involved.

          The rule sets embedded in these binaries are the published ones; `invoicekit-mcp -version` prints their exact versions.

          Engine: `github.com/dcnws/invoicekit.go` at the release named by this tag. Checksums: `sha256sum -c SHA256SUMS.txt`.
          NOTES
          gh release create "$TAG" \
            --title "invoicekit-mcp $TAG" \
            --notes-file notes.md \
            dist/*.tar.gz dist/SHA256SUMS.txt
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
      # The point of publishing binaries is that someone without a GitHub
      # account can have one, so that is what gets verified.
      - name: the assets are public
        run: |
          set -eu
          url="https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}"
          curl -s "$url" | node -e '
          let d = "";
          process.stdin.on("data", (c) => (d += c)).on("end", () => {
            const j = JSON.parse(d);
            if (!j.url) { console.error("the release is not readable without credentials"); process.exit(1); }
            const assets = j.assets || [];
            if (assets.length < 6) { console.error("only " + assets.length + " assets published"); process.exit(1); }
            console.log(j.tag_name + ": " + assets.map(a => a.name).join(", "));
          });'
        env:
          TAG: ${{ github.ref_name }}
      # The notes tell a user "Checksums: sha256sum -c SHA256SUMS.txt". This
      # runs that sentence as written, on the published files, holding only one
      # asset — which is what a person who downloaded one platform's binary
      # actually has. A sums file naming ./x.tar.gz failed exactly this.
      - name: and the checksums verify the way the notes say they will
        run: |
          set -eu
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}"
          mkdir -p verify && cd verify
          curl -sfL -O "$base/SHA256SUMS.txt"
          curl -sfL -O "$base/${TAG}-linux-amd64.tar.gz"
          grep " ${TAG}-linux-amd64.tar.gz$" SHA256SUMS.txt | sha256sum -c - \
            || { echo "::error::SHA256SUMS.txt does not verify against downloaded filenames"; exit 1; }
        env:
          TAG: ${{ github.ref_name }}
