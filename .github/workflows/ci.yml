name: ci
on:
  push:
    branches: [main]
    # A tag is the moment the version a client reads stops being a detail, so
    # the release itself is what CI checks.
    tags: ['v*']
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Tags, so the step below can tell which release this commit is, if any.
          fetch-depth: 0
      # The server introduces itself with the engine release it links, and this
      # repository is tagged to match. That is only honest while the two are the
      # same number, so the tag is checked against go.mod rather than trusted.
      - name: every workflow file in this repository is valid YAML
        # A workflow file GitHub cannot parse produces a run with no jobs and
        # no logs, which is the least diagnosable failure GitHub offers. One of
        # ours did exactly that, so the parse is checked here, where a failure
        # has a name and a line number.
        run: |
          set -eu
          for f in .github/workflows/*.yml; do
            if python3 -c 'import yaml' 2>/dev/null; then
              python3 -c 'import sys,yaml; yaml.safe_load(open(sys.argv[1])); print("parsed " + sys.argv[1])' "$f"
            else
              ruby -ryaml -e 'YAML.load_file(ARGV[0]); puts "parsed " + ARGV[0]' "$f"
            fi
          done
      - name: the release tag is the engine release this build links
        # go.mod may put the requirement on one line or inside a require block,
        # so both forms are read rather than assumed: a guard that matches
        # neither fails every run, and a permanently red gate protects nothing.
        run: |
          pinned=$(awk '$1=="github.com/dcnws/invoicekit.go" {print $2}
                        $1=="require" && $2=="github.com/dcnws/invoicekit.go" {print $3}' go.mod | head -1)
          test -n "$pinned" || { echo "::error=no engine requirement in go.mod"; exit 1; }
          tag=$(git tag --points-at HEAD --sort=-v:refname | grep -E '^v[0-9]' | head -1)
          if [ -n "$tag" ]; then
            # Both sides are v-prefixed: go.mod writes v0.2.9, and so does the
            # tag. Stripping one prefix and not the other is how this guard
            # nearly failed every run it ever had.
            test "$tag" = "$pinned" || {
              echo "::error::$tag disagrees with the pinned engine $pinned"
              exit 1
            }
            echo "$tag is the engine release this build links"
          fi
      # The Go version is read from go.mod, never written here: a pinned version
      # in a workflow silently rots.
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go build ./...
      - run: go test -race ./...
      # The claim this whole project rests on, made checkable: every document
      # this server reads is read by code whose dependency graph contains no
      # network stack at all. Not "we promise not to call out" — there is no
      # http client in the binary's path from a tool call to a verdict.
      - name: the code that reads invoices has no network in its dependency graph
        run: |
          if go list -deps ./internal/tools | grep -E '^(net|net/http|net/url|crypto/tls)$'; then
            echo "::error::internal/tools gained a network dependency; an invoice must not leave the machine"
            exit 1
          fi
      # A server that starts and then refuses to talk protocol is the failure
      # mode users hit first, so the handshake and the version report are run
      # here rather than assumed.
      - name: the server reports its engine and rule sets
        run: |
          go run ./cmd/invoicekit-mcp -version > out.json
          node -e '
          const j = require("./out.json");
          const want = ["en16931", "xrechnung", "peppol"];
          const have = (j.rule_sets || []).map(r => r.name);
          for (const n of want) if (!have.includes(n)) throw new Error("rule_sets has no " + n);
          for (const r of j.rule_sets) if (!r.version) throw new Error(r.name + " has no version");
          if (j.offline !== true) throw new Error("offline is not true");
          if (!/^[0-9]+\.[0-9]+\.[0-9]+$/.test(j.engine_version || "")) throw new Error("engine_version looks wrong: " + j.engine_version);
          console.log("engine " + j.engine_version + " · " + j.rule_sets.map(r => r.name + " " + r.version).join(", "));
          '
